      <h1>Conversation Search</h1>
      <section id="status" class="status-card" aria-live="polite">Open ChatGPT to search or sync conversations.</section>

        <span>Open search</span>
      </button>
      <button id="open-chatgpt" type="button">

      </button>
    </main>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
